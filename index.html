<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000"><title>Вещи</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#000;color:#ece3d2;font:14px/1.5 Georgia,serif;background-image:none}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid #e7c789;outline-offset:7px}header{max-width:1120px;margin:auto;padding:54px 32px 34px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font:10px Arial,sans-serif;letter-spacing:3px;color:#b7a68b;text-transform:uppercase}h1{font-size:44px;font-weight:400;letter-spacing:-1.8px;margin:9px 0}header p{color:#a89c89;font-size:14px;margin:0}.edition{text-align:right;font:11px/1.8 Arial,sans-serif;color:#8d806c}.cabinet{max-width:1056px;margin:0 auto;border:15px solid #4c3020;border-radius:8px 8px 4px 4px;box-shadow:0 0 0 1px #795337,0 2px 0 3px #25180f,0 28px 70px #0008,inset 0 0 15px #000;background:#302013;position:relative}.cabinet:before{content:"";position:absolute;inset:-14px;pointer-events:none;background:repeating-linear-gradient(91deg,transparent 0 3px,#b8864c0b 4px,transparent 6px 15px);z-index:2}.shelf{height:250px;position:relative;display:grid;grid-template-columns:repeat(var(--columns,3),minmax(0,1fr));padding:26px 35px 24px;gap:25px;align-items:end;background:radial-gradient(ellipse at 50% -20%,#dca96630,transparent 70%),repeating-linear-gradient(90deg,#ffffff02 0 1px,transparent 2px 48px),linear-gradient(#1b110ce0,#49322266 60%,#27190d);box-shadow:inset 0 18px 32px #0008,inset 12px 0 18px #0004,inset -12px 0 18px #0004}.shelf:not(:last-child){border-bottom:17px solid #67462b}.shelf:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:19px;background:linear-gradient(#986d4444,#322012);box-shadow:0 2px 0 #bd8d4c55,0 9px 16px #0005;pointer-events:none}.object{border:0;background:none;padding:0;cursor:pointer;position:relative;height:182px;display:flex;align-items:end;justify-content:center;isolation:isolate}.object:before{content:"";position:absolute;bottom:10px;width:80%;height:90%;border-radius:50%;background:radial-gradient(ellipse,#f2c67635,transparent 68%);opacity:0;transition:opacity .35s;z-index:-1}.object .object-photo{width:100%;height:174px;overflow:visible;filter:drop-shadow(7px 10px 5px #0008);transform:rotate(var(--tilt,0deg));transform-origin:50% 100%;transition:transform .4s,filter .4s}.object:hover .object-photo,.object:focus-visible .object-photo{transform:translateY(-7px) rotate(0deg);filter:drop-shadow(0 0 12px #f3ce8b65) drop-shadow(7px 14px 6px #0009)}.object:hover:before,.object:focus-visible:before{opacity:1}footer{max-width:1120px;margin:26px auto 0;padding:0 32px 35px;display:flex;justify-content:space-between;font:10px Arial,sans-serif;letter-spacing:1px;color:#8d806c}dialog{padding:0;width:min(860px,calc(100% - 32px));max-height:90vh;border:1px solid #77634b;border-radius:5px;background:#e9e0ce;color:#393126;box-shadow:0 35px 100px #0009}dialog::backdrop{background:#100e0bd9;backdrop-filter:blur(8px)}.detail{display:grid;grid-template-columns:1.1fr 1fr;min-height:440px}.stage{display:grid;place-items:center;padding:50px;background:radial-gradient(ellipse,#8c7250,#4a3b2b);min-width:0}.stage .object-photo{width:100%;height:260px;overflow:visible;filter:drop-shadow(10px 18px 10px #0005)}.copy{padding:75px 35px 35px;align-self:center}.copy .eyebrow{color:#8c7657}.copy h2{font-size:34px;font-weight:400;line-height:1.1;margin:16px 0 24px}.copy p{font-size:16px;line-height:1.7;color:#6d604f}.close{position:absolute;right:14px;top:14px;width:34px;height:34px;border:1px solid #9c8b6f66;background:#e9e0ce;color:#4b3c29;border-radius:50%;cursor:pointer;font:23px Arial}@media(max-width:650px){header{padding:30px 23px 25px}h1{font-size:35px}.edition{display:none}.cabinet{margin:0 16px;border-width:10px}.shelf{height:auto;min-height:230px;padding:25px 16px 30px;grid-template-columns:repeat(2,1fr);gap:25px 12px}.object{height:150px}.object .object-photo{height:145px}.shelf .object:last-child{grid-column:1 / -1}.detail{grid-template-columns:1fr}.stage{padding:35px;min-height:260px}.stage .object-photo{height:210px}.copy{padding:28px}.copy h2{font-size:29px}footer{padding:0 23px 25px;gap:20px;font-size:9px}header p{max-width:230px}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}dialog::backdrop{backdrop-filter:none}}
.top-space{height:208px}body{padding-bottom:60px}@media(max-width:650px){.top-space{height:182.5px}}

/* Transparent photographic cutouts sit directly on the wooden shelves. */
.object .object-photo{width:90%;max-width:230px;height:174px;object-fit:contain;object-position:center bottom;border:0;background:transparent;aspect-ratio:auto}
.object .object-photo.landscape{height:135px}
.stage .object-photo{width:100%;height:300px;max-height:55vh;object-fit:contain;border:0;background:transparent;aspect-ratio:auto}
.shelf:empty{min-height:250px}


@media(max-width:650px){.object .object-photo{height:145px;max-width:100%}.object .object-photo.landscape{height:110px}.stage .object-photo{height:210px;max-height:40vh}.shelf:empty{min-height:230px}}
</style>
</head>
<body>
<div class="top-space" aria-hidden="true"></div>
<main class="cabinet" aria-label="Шкаф с коллекцией предметов"></main>
<dialog aria-labelledby="object-title"><button class="close" aria-label="Закрыть">×</button><div class="detail"><div class="stage"></div><div class="copy"><div class="eyebrow" id="object-meta"></div><h2 id="object-title"></h2><p id="object-description"></p></div></div></dialog>
<!-- Image attribution and license information: CREDITS.md -->
<script>
const data=[
{title:'Медведь по имени Миша',date:'12.12.98',description:'Одно ухо чуть ниже другого, а на лапе — шов, который зашивали уже три раза. Он пережил все переезды и до сих пор пахнет домом. Некоторые вещи становятся семьёй.',photo:'https://pngimg.com/uploads/teddy_bear/teddy_bear_PNG57.png',shape:'portrait'},
{title:'Письмо без повода',date:'12.12.17',description:'«Пишу тебе просто так». Внутри — две страницы про обычный вторник, погоду и кота у подъезда. Уже не вспомнить, о чём мы тогда переписывались в телефоне. А это письмо осталось.',photo:'https://pngimg.com/uploads/envelope/envelope_PNG100783.png',shape:'portrait'},
{title:'Август у воды',date:'12.12.19',description:'Последний день отпуска. Вода уже холодная, но домой всё равно не хочется. Камера сохранила тот день: солёный воздух, блики на воде и последние кадры перед дорогой домой.',photo:'https://pngimg.com/uploads/photo_camera/photo_camera_PNG101640.png',shape:'landscape'},
{title:'Сторона Б',date:'12.12.04',description:'Сборник, записанный с радио. Между песнями слышны обрывки рекламы и голос ведущего. На второй стороне — одна песня, которую я так и не смог найти.',photo:'https://pngimg.com/uploads/audio_cassette/audio_cassette_PNG92167.png',shape:'portrait'},
{title:'Ключ от первого дома',date:'12.12.12',description:'Замок давно сменили, и дверь перекрасили. Этот ключ больше ничего не открывает. Но стоит взять его в руки — и снова помнишь лестницу, скрип половиц и свет на кухне.',photo:'https://pngimg.com/uploads/key/key_PNG103680.png',shape:'portrait'},
{title:'До следующего лета',date:'12.12.16',description:'Жёлтая утка из летней поездки. Сначала плавала в море, потом ехала домой в чемодане. Теперь ждёт следующего лета на полке.',photo:'https://pngimg.com/uploads/rubber_duck/rubber_duck_PNG99899.png',shape:'landscape'},
{title:'Маленький путешественник',date:'12.12.01',description:'У этой машинки не открываются двери, зато она объехала всю квартиру, дачу и половину песочницы. Потёртая краска — её личная карта путешествий.',photo:'https://pngimg.com/uploads/tesla_car/tesla_car_PNG34.png',shape:'portrait'},
{title:'Гербарий сентября',date:'12.12.20',description:'Здесь должны были быть важные планы. Но между страницами оказались листья, билеты и один засохший цветок. Кажется, это и были самые важные планы.',photo:'https://pngimg.com/uploads/diary/diary_PNG12.png',shape:'portrait'},
{title:'Море в кармане',date:'12.12.15',description:'Нашлась на берегу рано утром, когда пляж был совсем пустым. Её нельзя приложить к уху — слишком маленькая. Но шум того утра я помню и без неё.',photo:'https://pngimg.com/uploads/seashell/seashell_PNG82.png',shape:'portrait'}
];
// Increase minimumShelves to add empty shelves. Adding objects also grows the cabinet.
const cabinetSettings = { minimumShelves: 6, objectsPerShelf: 3 };
const cabinet=document.querySelector('.cabinet');
function photoMarkup(item, large=false) {
  return '<img class="object-photo '+item.shape+'" src="'+item.photo+'" alt="'+item.title+'" loading="'+(large?'eager':'lazy')+'" decoding="async">';
}
function renderCabinet() {
  cabinet.replaceChildren();
  const count = Math.max(cabinetSettings.minimumShelves, Math.ceil(data.length / cabinetSettings.objectsPerShelf));
  for (let row=0; row<count; row++) {
    const shelf=document.createElement('section');
    shelf.className='shelf';
    shelf.setAttribute('aria-label','Полка '+(row+1));
    shelf.style.setProperty('--columns',cabinetSettings.objectsPerShelf);
    data.slice(row*cabinetSettings.objectsPerShelf,(row+1)*cabinetSettings.objectsPerShelf).forEach((item,column)=>{
      const i=row*cabinetSettings.objectsPerShelf+column;
      const button=document.createElement('button');
      button.className='object';
      button.style.setProperty('--tilt',[-3,2,-2,3,-4,2,-2,1,3][i%9]+'deg');
      button.setAttribute('aria-label','Рассмотреть: '+item.title);
      button.innerHTML=photoMarkup(item);
      button.onclick=()=>openItem(i);
      shelf.append(button);
    });
    cabinet.append(shelf);
  }
}
renderCabinet();
const dialog=document.querySelector('dialog');let current=0;
function render(){const item=data[current];document.querySelector('.stage').innerHTML=photoMarkup(item,true);document.querySelector('#object-meta').textContent=item.date;document.querySelector('#object-title').textContent=item.title;document.querySelector('#object-description').textContent=item.description}
function openItem(i){current=i;render();dialog.showModal();document.body.style.overflow='hidden'}
function step(n){current=(current+n+data.length)%data.length;render()}
document.querySelector('.close').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>document.body.style.overflow='');
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});
</script>
</body></html>
