<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#201c18"><title>Вещи</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#201c18;color:#ece3d2;font:14px/1.5 Georgia,serif;background-image:radial-gradient(ellipse at 50% 0,#443a2a55,transparent 65%)}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid #e7c789;outline-offset:7px}header{max-width:1120px;margin:auto;padding:54px 32px 34px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font:10px Arial,sans-serif;letter-spacing:3px;color:#b7a68b;text-transform:uppercase}h1{font-size:44px;font-weight:400;letter-spacing:-1.8px;margin:9px 0}header p{color:#a89c89;font-size:14px;margin:0}.edition{text-align:right;font:11px/1.8 Arial,sans-serif;color:#8d806c}.cabinet{max-width:1056px;margin:0 auto;border:15px solid #4c3020;border-radius:8px 8px 4px 4px;box-shadow:0 0 0 1px #795337,0 2px 0 3px #25180f,0 28px 70px #0008,inset 0 0 15px #000;background:#302013;position:relative}.cabinet:before{content:"";position:absolute;inset:-14px;pointer-events:none;background:repeating-linear-gradient(91deg,transparent 0 3px,#b8864c0b 4px,transparent 6px 15px);z-index:2}.shelf{height:250px;position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:26px 35px 24px;gap:25px;align-items:end;background:radial-gradient(ellipse at 50% -20%,#dca96630,transparent 70%),repeating-linear-gradient(90deg,#ffffff02 0 1px,transparent 2px 48px),linear-gradient(#1b110ce0,#49322266 60%,#27190d);box-shadow:inset 0 18px 32px #0008,inset 12px 0 18px #0004,inset -12px 0 18px #0004}.shelf:not(:last-child){border-bottom:17px solid #67462b}.shelf:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:19px;background:linear-gradient(#986d4444,#322012);box-shadow:0 2px 0 #bd8d4c55,0 9px 16px #0005;pointer-events:none}.object{border:0;background:none;padding:0;cursor:pointer;position:relative;height:182px;display:flex;align-items:end;justify-content:center;isolation:isolate}.object:before{content:"";position:absolute;bottom:10px;width:80%;height:90%;border-radius:50%;background:radial-gradient(ellipse,#f2c67635,transparent 68%);opacity:0;transition:opacity .35s;z-index:-1}.object svg{width:100%;height:174px;overflow:visible;filter:drop-shadow(7px 10px 5px #0008);transform:rotate(var(--tilt,0deg));transform-origin:50% 100%;transition:transform .4s,filter .4s}.object:hover svg,.object:focus-visible svg{transform:translateY(-7px) rotate(0deg);filter:drop-shadow(0 0 12px #f3ce8b65) drop-shadow(7px 14px 6px #0009)}.object:hover:before,.object:focus-visible:before{opacity:1}.label{position:absolute;bottom:-15px;left:50%;transform:translate(-50%,5px);font:10px Arial,sans-serif;letter-spacing:.5px;white-space:nowrap;opacity:0;color:#e6cfaa;transition:.3s}.object:hover .label,.object:focus-visible .label{opacity:1;transform:translate(-50%,0)}footer{max-width:1120px;margin:26px auto 0;padding:0 32px 35px;display:flex;justify-content:space-between;font:10px Arial,sans-serif;letter-spacing:1px;color:#8d806c}dialog{padding:0;width:min(860px,calc(100% - 32px));max-height:90vh;border:1px solid #77634b;border-radius:5px;background:#e9e0ce;color:#393126;box-shadow:0 35px 100px #0009}dialog::backdrop{background:#100e0bd9;backdrop-filter:blur(8px)}.detail{display:grid;grid-template-columns:1.1fr 1fr;min-height:440px}.stage{display:grid;place-items:center;padding:50px;background:radial-gradient(ellipse,#8c7250,#4a3b2b);min-width:0}.stage svg{width:100%;height:260px;overflow:visible;filter:drop-shadow(10px 18px 10px #0005)}.copy{padding:75px 35px 35px;align-self:center}.copy .eyebrow{color:#8c7657}.copy h2{font-size:34px;font-weight:400;line-height:1.1;margin:16px 0 24px}.copy p{font-size:16px;line-height:1.7;color:#6d604f}.close{position:absolute;right:14px;top:14px;width:34px;height:34px;border:1px solid #9c8b6f66;background:#e9e0ce;color:#4b3c29;border-radius:50%;cursor:pointer;font:23px Arial}.navigation{display:flex;justify-content:space-between;align-items:center;margin-top:32px;font:11px Arial;color:#887355}.navigation button{border:1px solid #af9b7a;background:transparent;padding:7px 13px;border-radius:3px;cursor:pointer}.hint{font-size:11px!important;color:#a18e74!important;margin-top:22px!important}@media(max-width:650px){header{padding:30px 23px 25px}h1{font-size:35px}.edition{display:none}.cabinet{margin:0 16px;border-width:10px}.shelf{height:auto;min-height:230px;padding:25px 16px 30px;grid-template-columns:repeat(2,1fr);gap:25px 12px}.object{height:150px}.object svg{height:145px}.shelf .object:last-child{grid-column:1 / -1}.label{opacity:1;bottom:-20px;transform:translateX(-50%);font-size:9px}.detail{grid-template-columns:1fr}.stage{padding:35px;min-height:260px}.stage svg{height:210px}.copy{padding:28px}.copy h2{font-size:29px}footer{padding:0 23px 25px;gap:20px;font-size:9px}header p{max-width:230px}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}dialog::backdrop{backdrop-filter:none}}
.top-space{height:208px}body{padding-bottom:60px}@media(max-width:650px){.top-space{height:182.5px}}
</style>
</head>
<body>
<div class="top-space" aria-hidden="true"></div>
<main class="cabinet" aria-label="Шкаф с коллекцией предметов"></main>
<dialog aria-labelledby="object-title"><button class="close" aria-label="Закрыть">×</button><div class="detail"><div class="stage"></div><div class="copy"><div class="eyebrow" id="object-meta"></div><h2 id="object-title"></h2><p id="object-description"></p><div class="navigation"><button id="prev" aria-label="Предыдущий предмет">←</button><span id="position"></span><button id="next" aria-label="Следующий предмет">→</button></div><p class="hint">← → — листать · Esc — вернуться к полкам</p></div></div></dialog>
<script>
const wrap = body => '<svg viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#f6eed8"/><stop offset="1" stop-color="#cbb99a"/></linearGradient><linearGradient id="brass"><stop stop-color="#73512a"/><stop offset=".45" stop-color="#d5b16c"/><stop offset="1" stop-color="#816038"/></linearGradient><radialGradient id="fur"><stop stop-color="#c6a07a"/><stop offset="1" stop-color="#87603f"/></radialGradient></defs>'+body+'</svg>';
const data=[
{title:'Медведь по имени Миша',meta:'Детство · 1998',description:'Одно ухо чуть ниже другого, а на лапе — шов, который зашивали уже три раза. Он пережил все переезды и до сих пор пахнет домом. Некоторые вещи становятся семьёй.',art:wrap('<ellipse cx="110" cy="176" rx="68" ry="8" fill="#0004"/><g fill="url(#fur)" stroke="#765335" stroke-width="2"><ellipse cx="110" cy="126" rx="46" ry="48"/><ellipse cx="64" cy="125" rx="18" ry="32" transform="rotate(23 64 125)"/><ellipse cx="155" cy="124" rx="18" ry="32" transform="rotate(-25 155 124)"/><ellipse cx="78" cy="165" rx="25" ry="18"/><ellipse cx="143" cy="165" rx="25" ry="18"/><circle cx="76" cy="41" r="19"/><circle cx="145" cy="39" r="19"/><ellipse cx="110" cy="66" rx="43" ry="40"/></g><ellipse cx="110" cy="79" rx="23" ry="18" fill="#d8bb91"/><g fill="#30251d"><circle cx="94" cy="60" r="4"/><circle cx="128" cy="60" r="4"/><ellipse cx="110" cy="74" rx="7" ry="5"/></g><path d="M110 78v9m-9-1q9 9 18 0" fill="none" stroke="#4a3526" stroke-width="2"/><path d="m86 102 25 7 25-9-4 24-22-10-21 11z" fill="#6d3431"/><circle cx="110" cy="111" r="6" fill="#9a5148"/>')},
{title:'Письмо без повода',meta:'Бумага · 2017',description:'«Пишу тебе просто так». Внутри — две страницы про обычный вторник, погоду и кота у подъезда. Уже не вспомнить, о чём мы тогда переписывались в телефоне. А это письмо осталось.',art:wrap('<g transform="rotate(-8 110 100)"><path d="M38 44h145v126H38z" fill="url(#paper)"/><g stroke="#a29780" opacity=".65"><path d="M56 69h102M56 81h91M56 93h108M56 105h85"/></g><path d="M25 87h174v89H25z" fill="#c9b28a" stroke="#b39a74"/><path d="m25 176 87-65 87 65" fill="#dfccaa" stroke="#bba17b"/><path d="m25 87 87 67 87-67" fill="#ecdbb8" stroke="#bba17b"/><circle cx="112" cy="146" r="15" fill="#8b3f30"/><circle cx="112" cy="146" r="11" fill="none" stroke="#b96749"/><path d="m107 147 5-7 5 7-5 5z" fill="#b96749"/></g>')},
{title:'Август у воды',meta:'Фотокарточка · 2019',description:'Последний день отпуска. Вода уже холодная, но домой всё равно не хочется. Снимок немного выцвел, зато теперь на нём ровно тот цвет, который остался в памяти.',art:wrap('<g transform="rotate(7 110 100)"><path d="M47 13h132v169H47z" fill="#f0e8d6"/><path d="M57 24h112v120H57z" fill="#9baaa2"/><path d="M57 79q32-24 60-9t52-9v83H57z" fill="#778772"/><path d="M57 105q40-12 112-6v45H57z" fill="#a9b7a6"/><path d="m57 136 43-29 69 31v6H57z" fill="#c2b28c"/><circle cx="143" cy="50" r="14" fill="#e9d5a0"/><path d="M70 160q35-5 70 1" stroke="#807b70" fill="none"/></g>')},
{title:'Сторона Б',meta:'Кассета · 2004',description:'Сборник, записанный с радио. Между песнями слышны обрывки рекламы и голос ведущего. На второй стороне — одна песня, которую я так и не смог найти.',art:wrap('<g transform="rotate(-4 110 110)"><rect x="22" y="51" width="176" height="117" rx="10" fill="#333b39" stroke="#72756a" stroke-width="2"/><rect x="33" y="62" width="154" height="72" rx="5" fill="#d6c6a4"/><path d="M33 82h154v12H33z" fill="#9b4f3e"/><text x="44" y="77" fill="#534734" font-family="monospace" font-size="11">SUMMER MIX / 04</text><rect x="60" y="102" width="100" height="25" rx="12" fill="#4b4d42"/><g fill="#c1b99c" stroke="#777466" stroke-width="4"><circle cx="77" cy="114" r="13"/><circle cx="144" cy="114" r="13"/></g><path d="m58 168 13-27h80l13 27" fill="#454a43" stroke="#72756a"/><g fill="#b5ad94"><circle cx="38" cy="152" r="3"/><circle cx="182" cy="152" r="3"/></g></g>')},
{title:'Ключ от первого дома',meta:'Находка · 2012',description:'Замок давно сменили, и дверь перекрасили. Этот ключ больше ничего не открывает. Но стоит взять его в руки — и снова помнишь лестницу, скрип половиц и свет на кухне.',art:wrap('<g transform="rotate(33 110 100)" fill="url(#brass)" stroke="#614924" stroke-width="2"><circle cx="108" cy="55" r="34"/><circle cx="108" cy="55" r="20" fill="#302217"/><rect x="101" y="85" width="14" height="90" rx="3"/><path d="M114 146h26v13h-12v14h-14z"/></g><path d="M70 25q-35-27-31 21t45 19" stroke="#aa8a57" fill="none" stroke-width="3"/>')},
{title:'До следующего лета',meta:'Открытка · 2016',description:'Купили её в маленьком книжном у вокзала. Собирались отправить, но так и привезли домой в чемодане. Иногда незаполненная открытка рассказывает больше, чем подписанная.',art:wrap('<g transform="rotate(-5 110 100)"><path d="M24 39h175v130H24z" fill="url(#paper)"/><path d="M34 49h155v94H34z" fill="#a5b0a1"/><path d="m34 123 47-57 38 39 30-38 40 63v13H34" fill="#6c7c6d"/><path d="m66 84 15-18 19 20-14-5-7 5-5-7z" fill="#e3dfc8"/><path d="m140 81 9-14 16 25-13-9-5 3z" fill="#e3dfc8"/><text x="111" y="160" text-anchor="middle" fill="#74674f" font-size="10" letter-spacing="4">ДАЛЕКО</text></g>')},
{title:'Маленький путешественник',meta:'Игрушка · 2001',description:'У этой машинки не открываются двери, зато она объехала всю квартиру, дачу и половину песочницы. Потёртая краска — её личная карта путешествий.',art:wrap('<g transform="rotate(-3 110 130)"><path d="m25 121 31-8 23-41h67l30 42 24 9v32H25z" fill="#9b4936" stroke="#512e22" stroke-width="2"/><path d="m65 112 19-32h23v32zm51-32h25l24 32h-49z" fill="#a0b5b0" stroke="#472e22" stroke-width="3"/><path d="M31 135h161" stroke="#c57755"/><path d="M113 117v34" stroke="#6d362a"/><path d="M119 123h12" stroke="#d8b68b" stroke-width="3"/><g fill="#292521" stroke="#544b3e" stroke-width="4"><circle cx="66" cy="153" r="22"/><circle cx="160" cy="153" r="22"/></g><g fill="#c8b79a"><circle cx="66" cy="153" r="10"/><circle cx="160" cy="153" r="10"/></g><path d="M26 128h15v12H26" fill="#dfd4b7"/><path d="M190 128h9v12h-9" fill="#c59a61"/></g>')},
{title:'Гербарий сентября',meta:'Блокнот · 2020',description:'Здесь должны были быть важные планы. Но между страницами оказались листья, билеты и один засохший цветок. Кажется, это и были самые важные планы.',art:wrap('<g transform="rotate(5 110 100)"><rect x="49" y="19" width="124" height="161" rx="4" fill="#343f35" stroke="#6e7660"/><path d="M59 19v161" stroke="#202c24" stroke-width="3"/><rect x="78" y="39" width="69" height="31" fill="#c9ba96"/><text x="113" y="59" text-anchor="middle" fill="#54513e" font-size="11">СЕНТЯБРЬ</text><path d="M111 153q0-44 19-66" stroke="#a69863" stroke-width="2" fill="none"/><g fill="#9a8a55"><ellipse cx="118" cy="124" rx="15" ry="6" transform="rotate(-28 118 124)"/><ellipse cx="118" cy="108" rx="14" ry="5" transform="rotate(30 118 108)"/><ellipse cx="131" cy="94" rx="12" ry="5" transform="rotate(-40 131 94)"/></g><path d="M157 20v159" stroke="#9f7451" stroke-width="5"/></g>')},
{title:'Море в кармане',meta:'Ракушка · 2015',description:'Нашлась на берегу рано утром, когда пляж был совсем пустым. Её нельзя приложить к уху — слишком маленькая. Но шум того утра я помню и без неё.',art:wrap('<path d="M110 166Q2 137 42 69q12-15 24-11 5-27 24-21 18-26 36-3 23-8 29 19 24-4 29 24 30 46-74 89" fill="#d6bea0" stroke="#a78b70" stroke-width="2"/><g stroke="#ae8d73" fill="none" stroke-width="3"><path d="M110 163 45 76M110 163 70 59M110 163 92 41M110 163 121 37M110 163 149 59M110 163 176 81"/></g><path d="M96 160q14-15 28 0l-4 15h-19z" fill="#b29476"/><path d="M46 92q50-31 120 0" stroke="#f2dcc1" opacity=".5" fill="none" stroke-width="3"/>')}
];
const cabinet=document.querySelector('.cabinet');
data.forEach((item,i)=>{if(i%3===0){const shelf=document.createElement('section');shelf.className='shelf';shelf.setAttribute('aria-label','Полка '+(i/3+1));cabinet.append(shelf)}const button=document.createElement('button');button.className='object';button.style.setProperty('--tilt',[-3,2,-2,3,-4,2,-2,1,3][i]+'deg');button.setAttribute('aria-label','Рассмотреть: '+item.title);button.innerHTML=item.art+'<span class="label">'+item.title+'</span>';button.onclick=()=>openItem(i);cabinet.lastChild.append(button)});
const dialog=document.querySelector('dialog');let current=0;
function render(){const item=data[current];document.querySelector('.stage').innerHTML=item.art;document.querySelector('#object-meta').textContent=item.meta;document.querySelector('#object-title').textContent=item.title;document.querySelector('#object-description').textContent=item.description;document.querySelector('#position').textContent=String(current+1).padStart(2,'0')+' / '+String(data.length).padStart(2,'0')}
function openItem(i){current=i;render();dialog.showModal();document.body.style.overflow='hidden'}
function step(n){current=(current+n+data.length)%data.length;render()}
document.querySelector('.close').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>document.body.style.overflow='');
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{if(!dialog.open)return;if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});
</script>
</body></html>
